name = "a377tool"
compatibility_date = "2024-11-01"
pages_build_output_dir = "public"

# ---------------------------------------------------------------------------
#  D1 数据库绑定（「周末见面地推荐」用）
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "meet-db"
database_id = "bb0be454-de0a-468f-8ac4-28da11a937a9"

# ---------------------------------------------------------------------------
#  KV 命名空间绑定（展示组件的图片 / 视频上传，接口在 functions/api/media*）
#
#  为什么不用 R2：R2 免费额度更大（10GB 存储、无出口费），但**激活必须绑
#  付款方式**；KV 免费额度是 1GB 总量 / 单值 25MiB / 每天 1000 次写，
#  不要付款方式。这个站要放的就是几十张图和几秒的短视频，够用且零门槛。
#
#  创建（一次性）：
#    cd web && npx wrangler kv namespace create MEDIA
#  把返回的 id 填到下面替换全 0 的占位值，然后重新部署才生效。
#
#  本地开发不用管这个 id —— wrangler pages dev 用本地模拟存储，
#  数据落在 .d1dev 旁边（已 gitignore）。
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "MEDIA"
id = "d21b036e948f49beb1a4ab0ad4c7288d"

# ---------------------------------------------------------------------------
#  环境变量（用 secret 设置，不要写在这个文件里）
#
#    wrangler pages secret put SESSION_SECRET   # 必填，>=16 字符随机串
#    wrangler pages secret put ADMIN_TOKEN      # 管理页口令
#    wrangler pages secret put ADMIN_EMAIL      # 接收审批邮件的邮箱
#    wrangler pages secret put RESEND_KEY       # Resend API Key（可选，留空不发邮件）
#    wrangler pages secret put MAIL_FROM        # 发件人
#
#  本地开发用的默认值放 .dev.vars（不提交）
# ---------------------------------------------------------------------------

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f5">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/tokens.css">
<script src="/assets/theme.js"></script>
<link rel="stylesheet" href="/assets/shell.css">
<script src="/assets/shell.js" defer></script>
<title>生图 · A377Tool</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--ui-bg);color:var(--ui-ink);
    font:15px/1.65 var(--ui-font);
    -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  }
  .wrap{max-width:760px;margin:0 auto;padding:52px 22px 90px}
  .eyebrow{
    display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;color:var(--ui-accent-ink);
    background:var(--ui-accent-soft);padding:4px 10px;border-radius:var(--ui-r-full);margin-bottom:14px
  }
  .eyebrow svg{width:12px;height:12px;flex:none}
  header h1{margin:0 0 9px;font-size:32px;line-height:1.18;letter-spacing:-.032em;font-weight:650}
  header p{margin:0;color:var(--ui-ink-2);font-size:14px;max-width:56ch}

  .grid{display:grid;gap:14px;margin-top:28px}
  @media (min-width:620px){.grid{grid-template-columns:1fr 1fr}}
  .card{
    display:flex;flex-direction:column;gap:12px;padding:21px 20px;
    border-radius:var(--ui-r-lg);background:var(--ui-surface);border:1px solid var(--ui-line);
    text-decoration:none;color:var(--ui-ink);box-shadow:var(--ui-shadow-1);
    transition:border-color .18s var(--ui-ease),background .18s var(--ui-ease),transform .18s var(--ui-ease)
  }
  .card:focus-visible{outline:2px solid var(--ui-accent);outline-offset:2px}
  .card .ico{
    width:42px;height:42px;display:grid;place-items:center;flex:none;
    border-radius:12px;background:var(--ui-accent-soft);color:var(--ui-accent)
  }
  .card .ico svg{width:21px;height:21px}
  .card h2{margin:2px 0 0;font-size:16.5px;font-weight:650;letter-spacing:-.012em}
  .card p{margin:0;color:var(--ui-ink-3);font-size:13px;line-height:1.62}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .tag{font-size:11.5px;padding:3px 9px;border-radius:var(--ui-r-full);background:var(--ui-sunken);color:var(--ui-ink-2);border:1px solid var(--ui-line)}
  .tag.on{background:var(--ui-ok-soft);color:var(--ui-ok);border-color:transparent}
  .go{margin-top:auto;font-size:13px;color:var(--ui-ink-3);display:flex;align-items:center;gap:5px;transition:transform .18s var(--ui-ease),color .18s}
  @media (hover:hover){
    .card:hover{border-color:var(--ui-accent);background:var(--ui-accent-soft);transform:translateY(-2px)}
    .card:hover .go{transform:translateX(3px);color:var(--ui-accent)}
  }

  .note{
    margin-top:20px;padding:15px 17px;border-radius:var(--ui-r-md);
    background:var(--ui-sunken);border:1px solid var(--ui-line);color:var(--ui-ink-2);
    font-size:12.5px;line-height:1.7
  }
  .note b{color:var(--ui-ink);font-weight:650}
  .note code{background:var(--ui-surface);border:1px solid var(--ui-line);border-radius:5px;padding:1px 5px;font-family:var(--ui-mono);font-size:12px}
  .act{
    margin:0 0 0 6px;padding:5px 12px;border-radius:8px;border:1px solid var(--ui-line-strong);
    background:var(--ui-surface);color:var(--ui-ink);font:inherit;font-size:12.5px;cursor:pointer
  }
  .act:hover{background:var(--ui-sunken);border-color:var(--ui-accent)}
  .msg{margin-top:8px;font-size:12.5px;min-height:18px}
  .msg.ok{color:var(--ui-ok)} .msg.err{color:var(--ui-err)}
</style>
</head>
<body data-nav="draw" data-shell="生图">
<div class="wrap">
  <header>
    <div class="eyebrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/>
      </svg>
      两个绘图工作台
    </div>
    <h1>生图</h1>
    <p>右边是浏览器直连 Right Code，左边是经后端代理的 Code0。按需要选，都是打开就能用。</p>
  </header>

  <div class="grid">
    <a class="card" href="/draw/studio/">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <circle cx="8.5" cy="8.5" r="1.8"/><path d="M21 15l-5-5L5 21"/>
        </svg>
      </span>
      <h2>Right Code 绘图工作台</h2>
      <p>支持单张 / 批量、1K / 2K / 4K，手机也能用。</p>
      <div class="tags"><span class="tag on">在线可用</span><span class="tag">批量</span><span class="tag">4K</span></div>
      <span class="go">进入 <span aria-hidden="true">→</span></span>
    </a>

    <a class="card" href="/draw/code0/">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/>
          <path d="M18 16l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/>
        </svg>
      </span>
      <h2>Code0 图片工作台</h2>
      <p>文生图 / 图生图 / 批量队列，6 个模型可选；API Key 在服务端，页面源码里看不到。</p>
      <div class="tags"><span class="tag on">在线可用</span><span class="tag">图生图</span><span class="tag">批量</span></div>
      <span class="go">进入 <span aria-hidden="true">→</span></span>
    </a>
  </div>

  <div class="note">
    <b>还有一个本地版</b>（功能一样，跑在自己电脑上，不经过服务器）：
    双击桌面「图片工作台」快捷方式，窗口别关，然后
    <button class="act" id="openLocal" type="button">打开本地服务</button>
    <div class="msg" id="localMsg"></div>
  </div>
</div>

<script>
document.getElementById("openLocal").addEventListener("click", async function () {
  var btn = this;
  var msg = document.getElementById("localMsg");
  var LOCAL = "http://127.0.0.1:8765";
  btn.disabled = true;
  msg.className = "msg";
  msg.textContent = "正在检查本地服务…";
  var alive = false;
  try {
    await fetch(LOCAL + "/", { mode: "no-cors", cache: "no-store" });
    alive = true;
  } catch (e) {
    alive = false;
  }
  btn.disabled = false;
  if (alive) {
    msg.className = "msg ok";
    msg.textContent = "服务在跑，正在打开…";
    window.open(LOCAL, "_blank");
  } else {
    msg.className = "msg err";
    msg.textContent = "没连上。先双击桌面「图片工作台」启动服务，窗口别关，再回来点一次。";
  }
});
</script>
</body>
</html>
